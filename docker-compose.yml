# Ambiente local. A API guarda os dados num arquivo JSON dentro do volume
# `dados` (nada de banco para subir). Para desenvolver contra uma planilha de
# teste, defina ARMAZENAMENTO=planilha, APPS_SCRIPT_URL e APPS_SCRIPT_CHAVE no
# .env — nunca a planilha de producao.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: univc_checkin_api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ARMAZENAMENTO: ${ARMAZENAMENTO:-arquivo}
      ARQUIVO_DADOS: /dados/banco.json
      APPS_SCRIPT_URL: ${APPS_SCRIPT_URL:-}
      APPS_SCRIPT_CHAVE: ${APPS_SCRIPT_CHAVE:-}
      PLANILHA_CACHE_SEGUNDOS: ${PLANILHA_CACHE_SEGUNDOS:-60}
      API_PORT: 3333
      API_HOST: 0.0.0.0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-troque-este-segredo-de-acesso-em-producao-0123456789}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-troque-este-segredo-de-refresh-em-producao-0123456789}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:8081,http://localhost:19006}
      CHECKIN_RATE_LIMIT_MAX: ${CHECKIN_RATE_LIMIT_MAX:-10}
      CHECKIN_RATE_LIMIT_WINDOW: ${CHECKIN_RATE_LIMIT_WINDOW:-1 minute}
      RELATORIO_TIMEZONE: ${RELATORIO_TIMEZONE:-America/Sao_Paulo}
      # Usuarios e registros ficticios no primeiro boot (o seed nao grava na
      # planilha e e idempotente).
      RUN_SEED_ON_BOOT: "true"
    volumes:
      - dados:/dados
    ports:
      - "${API_PORT:-3333}:3333"

volumes:
  dados:
